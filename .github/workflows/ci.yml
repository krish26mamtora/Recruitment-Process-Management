name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Build Backend (Spring Boot)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build Backend with Maven
        working-directory: ./backend/demo
        run: ./mvnw clean package -DskipTests

      # 2. Build Frontend (React)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      # 3. Verify Docker Build (Ensures Dockerfile is correct)
      - name: Build Docker Images
        run: |
          docker compose build
