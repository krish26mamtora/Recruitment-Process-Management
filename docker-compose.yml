services:
  backend:
    build:
      context: ./backend/demo
    image: rpms-backend:latest
    container_name: rpms-backend-container
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/EMS
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=@ICTsem6ABCD
    networks:
      - rpms-network

  frontend:
    build:
      context: ./frontend
    image: rpms-frontend:latest
    container_name: rpms-frontend-container
    ports:
      - "5173:80"
    networks:
      - rpms-network
    depends_on:
      - backend

networks:
  rpms-network:
    driver: bridge
